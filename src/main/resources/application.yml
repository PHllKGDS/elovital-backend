spring:
  application:
    name: elovital-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/elo-vital
    username: postgres
    password: Db@Obj.3213  # defina nas variáveis de ambiente da Run Configuration

  jpa:
    open-in-view: false        # evita consultas "escondidas" na camada de controller
    hibernate:
      ddl-auto: update       # o schema é criado pelo Flyway; o Hibernate só confere
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

server:
  port: 8080
